<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>TKS — revisão da Home</title><style>
*{box-sizing:border-box}body{margin:0;background:#eee;font:14px Arial,sans-serif}#view{display:block;border:0;background:white}aside{position:fixed;top:12px;width:235px;padding:16px;background:white;border:1px solid #ddd;z-index:100}aside p{font-size:12px;line-height:1.5}label{display:block;margin:14px 0}button,select{min-height:44px;max-width:100%;margin:3px 0;padding:8px}pre{font-size:10px;white-space:pre-wrap}fieldset{border:0;padding:0}body{width:var(--review-width)}aside{left:calc(var(--review-width) + 16px)}
</style></head><body><iframe id="view" title="Home TKS em largura de revisão"></iframe><aside><strong>Revisão da Home</strong><p>Ferramenta de QA, fora da navegação do site. Largura real do iframe; altura de viewport 900 px. A captura longa congela o hero nessa altura e expande o quadro.</p><label>Largura <select id="width"><option>1440</option><option>1024</option><option>768</option><option>430</option><option>390</option><option>360</option></select></label><label><input id="full" type="checkbox"> Captura longa</label><label><input id="nojs" type="checkbox"> Sem JavaScript na Home</label><fieldset><button data-section=".h6-hero">Abertura</button><button data-section=".h6-needs">Necessidades</button><button data-section=".h6-fleet">Frota</button><button data-section=".h6-company">Desde 2010</button><button data-section=".h6-business">Empresas</button><button data-section=".h6-closing">Fechamento</button></fieldset><pre id="diagnostics">Carregando…</pre></aside><script>
const params=new URLSearchParams(location.search);const width=Number(params.get('w'))||1440;const full=params.get('full')==='1';const nojs=params.get('nojs')==='1';const height=900;document.documentElement.style.setProperty('--review-width',`${width}px`);const frame=document.querySelector('#view');frame.width=width;frame.height=height;if(nojs)frame.setAttribute('sandbox','allow-same-origin');frame.src='/';document.querySelector('#width').value=String(width);document.querySelector('#full').checked=full;document.querySelector('#nojs').checked=nojs;
function reload(){location.href=`?w=${document.querySelector('#width').value}&full=${document.querySelector('#full').checked?1:0}&nojs=${document.querySelector('#nojs').checked?1:0}`;}
document.querySelectorAll('select,input').forEach(el=>el.addEventListener('change',reload));
frame.addEventListener('load',async()=>{const doc=frame.contentDocument;await doc.fonts.ready;if(full){const style=doc.createElement('style');style.textContent='.tks-home .h6-hero{height:900px!important}';doc.head.append(style);doc.querySelectorAll('img[loading="lazy"]').forEach(img=>img.loading='eager');await Promise.all([...doc.images].map(img=>img.decode().catch(()=>{})));frame.height=Math.ceil(doc.documentElement.scrollHeight);}
if(params.has('section')){const target=doc.querySelector('.h6-'+params.get('section'));if(target)frame.contentWindow.scrollTo(0,target.getBoundingClientRect().top+frame.contentWindow.scrollY-95);}doc.querySelectorAll('img').forEach(img=>img.loading='eager');await Promise.all([...doc.images].map(img=>img.decode().catch(()=>{})));
const report={width:frame.contentWindow.innerWidth,viewportHeight:height,mode:full?'long-capture-frozen-hero':'interactive-viewport',scripts:nojs?'blocked-by-sandbox':'enabled',documentWidth:doc.documentElement.scrollWidth,pageHeight:doc.documentElement.scrollHeight,images:[...doc.images].filter(img=>!img.complete||img.naturalWidth===0).length};document.querySelector('#diagnostics').textContent=JSON.stringify(report,null,2);});
document.querySelectorAll('[data-section]').forEach(button=>button.addEventListener('click',()=>{const target=frame.contentDocument.querySelector(button.dataset.section);frame.contentWindow.scrollTo({top:target.getBoundingClientRect().top+frame.contentWindow.scrollY-95,behavior:'instant'});window.scrollTo(0,0);}));
</script></body></html>
